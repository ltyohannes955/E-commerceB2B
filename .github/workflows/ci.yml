name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/setup@v3
        with:
          version: 11.19.0
          runtime: node@22
          cache: true
          install: false

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Validate workspace
        run: pnpm -r list --depth -1

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Audit dependencies
        run: pnpm audit --audit-level high

      - name: Scan for leaked secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v3
        with:
          version: 11.19.0
          runtime: node@22
          cache: true
          install: false

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Run unit tests with coverage
        run: pnpm test:unit

      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-coverage
          path: apps/**/coverage
          if-no-files-found: error
          retention-days: 14

  integration-tests:
    name: integration-tests
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: ecommerce-ci-integration
      COMPOSE_FILE: compose.yaml:compose.ci.yaml
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v3
        with:
          version: 11.19.0
          runtime: node@22
          cache: true
          install: false

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Start PostgreSQL and wait for health
        run: docker compose up --wait --wait-timeout 90 postgres

      - name: Run API integration and end-to-end tests
        run: pnpm test:integration

      - name: Stop and remove CI services
        if: always()
        run: docker compose down --volumes --remove-orphans

  build:
    name: build
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_API_URL: http://localhost:3001
      INTERNAL_API_URL: http://localhost:3001
      DATABASE_URL: postgresql://commerce:commerce_dev_password@localhost:5432/ecommerce?schema=public
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v3
        with:
          version: 11.19.0
          runtime: node@22
          cache: true
          install: false

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Build applications
        run: pnpm build
  browser-tests:
    name: browser-tests
    runs-on: ubuntu-latest
    env:
      NODE_ENV: development
      DATABASE_URL: postgresql://commerce:commerce_dev_password@localhost:5432/ecommerce?schema=public
      WEB_ORIGIN: http://localhost:3000
      INTERNAL_API_URL: http://localhost:3001
      AUTH_ACCESS_SECRET: phase1-ci-access-secret-change-me-please
      AUTH_CSRF_SECRET: phase1-ci-csrf-secret-change-me-please
      RESET_DELIVERY_ENABLED: 'true'
      PORT: 3001
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_DB: ecommerce
          POSTGRES_USER: commerce
          POSTGRES_PASSWORD: commerce_dev_password
        options: >-
          --health-cmd "pg_isready -U commerce -d ecommerce"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          version: 11.19.0
          runtime: node@22
          cache: true
          install: false
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Apply database migrations
        run: pnpm db:migrate:deploy
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Start API
        run: pnpm dev:api > api.log 2>&1 &

      - name: Wait for API health
        run: |
          for attempt in {1..30}; do
            curl --fail http://localhost:3001/api/health && exit 0
            sleep 2
          done
          cat api.log
          exit 1

      - name: Run browser tests
        run: pnpm test:e2e

      - name: Upload browser logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-artifacts
          path: |
            apps/web/test-results
            apps/web/playwright-report
            api.log
          if-no-files-found: ignore
